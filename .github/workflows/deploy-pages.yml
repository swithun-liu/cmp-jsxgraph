name: Deploy Web Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/visual-parity/package-lock.json

      - name: Install Pages smoke-test dependencies
        run: npm ci --prefix tools/visual-parity

      - name: Build Kotlin/Wasm site
        run: ./gradlew --no-daemon --no-build-cache --rerun-tasks :sample:webApp:wasmJsBrowserDistribution

      - name: Prepare GitHub Pages Wasm assets
        run: node tools/split-wasm-for-pages.mjs sample/webApp/build/dist/wasmJs/productionExecutable

      - name: Verify prepared GitHub Pages site
        run: |
          python3 -m http.server 8093 \
            --directory sample/webApp/build/dist/wasmJs/productionExecutable \
            >/tmp/cmp-jsxgraph-pages.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8093/ >/dev/null; then
              break
            fi
            sleep 1
          done
          BASE_URL='http://127.0.0.1:8093/?chunkedWasm=true' \
          EXPECT_CHUNKED_WASM='true' \
          SIMULATE_COMPRESSED_PART_RETRY='true' \
          npm --prefix tools/visual-parity run test:load

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: sample/webApp/build/dist/wasmJs/productionExecutable

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
