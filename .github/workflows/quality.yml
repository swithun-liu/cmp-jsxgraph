name: Quality Gate

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  multiplatform:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify generated production corpus
        run: |
          node tools/stability/generate-production-corpus.mjs
          git diff --exit-code -- \
            jsxgraph-core/src/commonTest/kotlin/com/swithun/jsxgraph/core/generated/ProductionCorpus.kt \
            jsxgraph-debug-ui/src/commonMain/kotlin/com/swithun/jsxgraph/debugui/generated/ProductionCorpus.kt

      - name: Reject internal endpoints and credential material
        shell: bash
        run: |
          set -euo pipefail
          organization_pattern='byte''dance|byted''\.org|byted''\.net|byte''intl|tiktok''-row|fei''shu|lark''\.office'
          if git grep -I -n -E "$organization_pattern"; then
            echo "Internal organization reference detected" >&2
            exit 1
          fi
          if git grep -I -n -E \
            '(AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH|PRIVATE) KEY-----|gh[pousr]_[A-Za-z0-9_]{20,}|github_pat_[A-Za-z0-9_]{20,}|sk-[A-Za-z0-9]{20,})'
          then
            echo "Credential-like material detected" >&2
            exit 1
          fi

      - name: Test translated modules
        run: |
          ./gradlew \
            :jsxgraph-core:allTests \
            :jsxgraph-compose:allTests \
            :jsxgraph-debug-ui:allTests

      - name: Verify Maven publication coordinates
        run: ./gradlew verifyPublicationCoordinates

      - name: Verify Maven publication archives
        run: |
          ./gradlew \
            :jsxgraph-core:publishAllPublicationsToBuildRepository \
            :jsxgraph-compose:publishAllPublicationsToBuildRepository
          bash tools/verify-publication-archives.sh

      - name: Build sample applications
        run: |
          ./gradlew \
            :sample:androidApp:assembleDebug \
            :sample:androidApp:assembleRelease \
            :sample:desktopApp:createDistributable \
            :sample:webApp:wasmJsBrowserDistribution \
            :jsxgraph-core:compileKotlinIosArm64 \
            :jsxgraph-core:compileKotlinIosSimulatorArm64 \
            :jsxgraph-core:compileKotlinIosX64 \
            :jsxgraph-compose:compileKotlinIosArm64 \
            :jsxgraph-compose:compileKotlinIosSimulatorArm64 \
            :jsxgraph-compose:compileKotlinIosX64 \
            :jsxgraph-debug-ui:compileKotlinIosArm64 \
            :jsxgraph-debug-ui:compileKotlinIosSimulatorArm64 \
            :jsxgraph-debug-ui:compileKotlinIosX64

      - name: Build iOS sample
        run: |
          xcodebuild \
            -project sample/iosApp/CMPJsxGraph.xcodeproj \
            -scheme CMPJsxGraph \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath sample/iosApp/build/xcode \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Reject Internet permission in sample APKs
        shell: bash
        run: |
          set -euo pipefail
          aapt2=""
          for candidate in "$ANDROID_HOME"/build-tools/*/aapt2; do
            if [[ -x "$candidate" ]]; then
              aapt2="$candidate"
            fi
          done
          test -n "$aapt2"
          for apk in \
            sample/androidApp/build/outputs/apk/debug/androidApp-debug.apk \
            sample/androidApp/build/outputs/apk/release/androidApp-release-unsigned.apk
          do
            permissions="$("$aapt2" dump permissions "$apk")"
            printf '%s\n' "$permissions"
            if grep -q 'android.permission.INTERNET' <<<"$permissions"; then
              echo "Unexpected android.permission.INTERNET in $apk" >&2
              exit 1
            fi
          done

  stable-visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/visual-parity/package-lock.json

      - name: Install visual audit dependencies
        run: npm ci --prefix tools/visual-parity

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg

      - name: Build Web production distribution
        run: ./gradlew :sample:webApp:wasmJsBrowserDistribution

      - name: Capture independent production corpus
        run: |
          python3 -m http.server 8093 \
            --directory sample/webApp/build/dist/wasmJs/productionExecutable \
            >/tmp/cmp-jsxgraph-stable-visual.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:8093/ >/dev/null; then
              break
            fi
            sleep 1
          done
          CORPUS_SOURCE=production \
          BASE_URL=http://127.0.0.1:8093/ \
          OUTPUT_DIR=captures/stable/production-desktop \
          VIEWPORT_WIDTH=1200 \
          VIEWPORT_HEIGHT=900 \
          MIN_CAPTURE_BYTES=8000 \
          npm --prefix tools/visual-parity run capture
          CORPUS_SOURCE=production \
          BASE_URL=http://127.0.0.1:8093/ \
          OUTPUT_DIR=captures/stable/arc-interaction \
          VIEWPORT_WIDTH=1200 \
          VIEWPORT_HEIGHT=900 \
          MIN_CAPTURE_BYTES=8000 \
          PARITY_CASE_IDS=prod_arc_direction_route \
          INTERACTION_TRACE=direction_point_arc_flip \
          npm --prefix tools/visual-parity run capture
          BASE_URL=http://127.0.0.1:8093/ \
          OUTPUT_DIR=captures/stable/arc-composition-interaction \
          VIEWPORT_WIDTH=1200 \
          VIEWPORT_HEIGHT=900 \
          MIN_CAPTURE_BYTES=8000 \
          PARITY_CASE_IDS=arc_compositions \
          INTERACTION_TRACE=arc_composition_parent_drag \
          npm --prefix tools/visual-parity run capture
          BASE_URL=http://127.0.0.1:8093/ \
          OUTPUT_DIR=captures/stable/sector-composition-interaction \
          VIEWPORT_WIDTH=1200 \
          VIEWPORT_HEIGHT=900 \
          MIN_CAPTURE_BYTES=8000 \
          PARITY_CASE_IDS=sector_compositions \
          INTERACTION_TRACE=sector_composition_parent_drag \
          npm --prefix tools/visual-parity run capture
          BASE_URL=http://127.0.0.1:8093/ \
          OUTPUT_DIR=captures/stable/circumcircle-creator-interaction \
          VIEWPORT_WIDTH=1200 \
          VIEWPORT_HEIGHT=900 \
          MIN_CAPTURE_BYTES=8000 \
          PARITY_CASE_IDS=circumcircle_creators \
          INTERACTION_TRACE=circumcircle_creator_parent_drag \
          npm --prefix tools/visual-parity run capture
          BASE_URL=http://127.0.0.1:8093/ \
          OUTPUT_DIR=captures/stable/point-reflection-interaction \
          VIEWPORT_WIDTH=1200 \
          VIEWPORT_HEIGHT=900 \
          MIN_CAPTURE_BYTES=8000 \
          PARITY_CASE_IDS=point_reflections \
          INTERACTION_TRACE=point_reflection_source_drag \
          npm --prefix tools/visual-parity run capture
          CORPUS_SOURCE=production \
          BASE_URL=http://127.0.0.1:8093/ \
          OUTPUT_DIR=captures/stable/circumcircle-interaction \
          VIEWPORT_WIDTH=1200 \
          VIEWPORT_HEIGHT=900 \
          MIN_CAPTURE_BYTES=8000 \
          PARITY_CASE_IDS=prod_geometry_circumcircle \
          INTERACTION_TRACE=circumcircle_parent_drag \
          npm --prefix tools/visual-parity run capture
          CORPUS_SOURCE=production \
          BASE_URL=http://127.0.0.1:8093/ \
          OUTPUT_DIR=captures/stable/midpoint-interaction \
          VIEWPORT_WIDTH=1200 \
          VIEWPORT_HEIGHT=900 \
          MIN_CAPTURE_BYTES=8000 \
          PARITY_CASE_IDS=prod_geometry_midpoints \
          INTERACTION_TRACE=midpoint_parent_drag \
          npm --prefix tools/visual-parity run capture
          CORPUS_SOURCE=production \
          BASE_URL=http://127.0.0.1:8093/ \
          OUTPUT_DIR=captures/stable/orthogonal-interaction \
          VIEWPORT_WIDTH=1200 \
          VIEWPORT_HEIGHT=900 \
          MIN_CAPTURE_BYTES=8000 \
          PARITY_CASE_IDS=prod_geometry_orthogonal_constructions \
          INTERACTION_TRACE=orthogonal_parent_drag \
          npm --prefix tools/visual-parity run capture
          CORPUS_SOURCE=production \
          BASE_URL=http://127.0.0.1:8093/ \
          OUTPUT_DIR=captures/stable/dynamic-circle-interaction \
          VIEWPORT_WIDTH=1200 \
          VIEWPORT_HEIGHT=900 \
          MIN_CAPTURE_BYTES=8000 \
          PARITY_CASE_IDS=prod_interaction_dynamic_circle_radius \
          INTERACTION_TRACE=dynamic_circle_radius_clamp \
          npm --prefix tools/visual-parity run capture
          CORPUS_SOURCE=production \
          BASE_URL=http://127.0.0.1:8093/ \
          OUTPUT_DIR=captures/stable/dynamic-segment-interaction \
          VIEWPORT_WIDTH=1200 \
          VIEWPORT_HEIGHT=900 \
          MIN_CAPTURE_BYTES=8000 \
          PARITY_CASE_IDS=prod_geometry_fixed_length_segment \
          INTERACTION_TRACE=dynamic_segment_length \
          npm --prefix tools/visual-parity run capture
          BASE_URL=http://127.0.0.1:8093/ \
          OUTPUT_DIR=captures/stable/curve-boolean-interaction \
          VIEWPORT_WIDTH=1200 \
          VIEWPORT_HEIGHT=900 \
          MIN_CAPTURE_BYTES=8000 \
          PARITY_CASE_IDS=curve_boolean_clipping \
          INTERACTION_TRACE=curve_boolean_parent_drag \
          npm --prefix tools/visual-parity run capture
          BASE_URL=http://127.0.0.1:8093/ \
          OUTPUT_DIR=captures/stable/inequality-line-interaction \
          VIEWPORT_WIDTH=1200 \
          VIEWPORT_HEIGHT=900 \
          MIN_CAPTURE_BYTES=5000 \
          PARITY_CASE_IDS=inequalities \
          INTERACTION_TRACE=inequality_line_parent_drag \
          npm --prefix tools/visual-parity run capture
          BASE_URL=http://127.0.0.1:8093/ \
          OUTPUT_DIR=captures/stable/inequality-function-interaction \
          VIEWPORT_WIDTH=1200 \
          VIEWPORT_HEIGHT=900 \
          MIN_CAPTURE_BYTES=5000 \
          PARITY_CASE_IDS=inequalities \
          INTERACTION_TRACE=inequality_function_driver_drag \
          npm --prefix tools/visual-parity run capture
          BASE_URL=http://127.0.0.1:8093/ \
          OUTPUT_DIR=captures/stable/vector-field-interaction \
          VIEWPORT_WIDTH=1200 \
          VIEWPORT_HEIGHT=900 \
          MIN_CAPTURE_BYTES=5000 \
          PARITY_CASE_IDS=vector_fields \
          INTERACTION_TRACE=vector_field_driver_drag \
          npm --prefix tools/visual-parity run capture
          BASE_URL=http://127.0.0.1:8093/ \
          OUTPUT_DIR=captures/stable/slope-field-interaction \
          VIEWPORT_WIDTH=1200 \
          VIEWPORT_HEIGHT=900 \
          MIN_CAPTURE_BYTES=5000 \
          PARITY_CASE_IDS=slope_fields \
          INTERACTION_TRACE=slope_field_driver_drag \
          npm --prefix tools/visual-parity run capture
          BASE_URL=http://127.0.0.1:8093/ \
          OUTPUT_DIR=captures/stable/ellipse-interaction \
          VIEWPORT_WIDTH=1200 \
          VIEWPORT_HEIGHT=900 \
          MIN_CAPTURE_BYTES=5000 \
          PARITY_CASE_IDS=ellipses \
          INTERACTION_TRACE=ellipse_point_drag \
          npm --prefix tools/visual-parity run capture
          BASE_URL=http://127.0.0.1:8093/ \
          OUTPUT_DIR=captures/stable/hyperbola-interaction \
          VIEWPORT_WIDTH=1200 \
          VIEWPORT_HEIGHT=900 \
          MIN_CAPTURE_BYTES=5000 \
          PARITY_CASE_IDS=hyperbolas \
          INTERACTION_TRACE=hyperbola_point_drag \
          npm --prefix tools/visual-parity run capture
          BASE_URL=http://127.0.0.1:8093/ \
          OUTPUT_DIR=captures/stable/web-load \
          VIEWPORT_WIDTH=1200 \
          VIEWPORT_HEIGHT=900 \
          npm --prefix tools/visual-parity run test:load
          BASE_URL=http://127.0.0.1:8093/ \
          npm --prefix tools/visual-parity run test:responsive
          BASE_URL=http://127.0.0.1:8093/ \
          npm --prefix tools/visual-parity run test:workbench

      - name: Enforce independent production parity
        run: |
          CORPUS_SOURCE=production \
          INPUT_DIR=captures/stable/production-desktop \
          MIN_CAPTURE_BYTES=8000 \
          MIN_BOARD_SSIM=0.93 \
          npm --prefix tools/visual-parity run audit
          CORPUS_SOURCE=production \
          INPUT_DIR=captures/stable/arc-interaction \
          MIN_CAPTURE_BYTES=8000 \
          MIN_BOARD_SSIM=0.93 \
          PARITY_CASE_IDS=prod_arc_direction_route \
          npm --prefix tools/visual-parity run audit
          INPUT_DIR=captures/stable/arc-composition-interaction \
          MIN_CAPTURE_BYTES=8000 \
          MIN_BOARD_SSIM=0.90 \
          PARITY_CASE_IDS=arc_compositions \
          npm --prefix tools/visual-parity run audit
          INPUT_DIR=captures/stable/sector-composition-interaction \
          MIN_CAPTURE_BYTES=8000 \
          MIN_BOARD_SSIM=0.90 \
          PARITY_CASE_IDS=sector_compositions \
          npm --prefix tools/visual-parity run audit
          INPUT_DIR=captures/stable/circumcircle-creator-interaction \
          MIN_CAPTURE_BYTES=8000 \
          MIN_BOARD_SSIM=0.93 \
          PARITY_CASE_IDS=circumcircle_creators \
          npm --prefix tools/visual-parity run audit
          INPUT_DIR=captures/stable/point-reflection-interaction \
          MIN_CAPTURE_BYTES=8000 \
          MIN_BOARD_SSIM=0.93 \
          PARITY_CASE_IDS=point_reflections \
          npm --prefix tools/visual-parity run audit
          CORPUS_SOURCE=production \
          INPUT_DIR=captures/stable/circumcircle-interaction \
          MIN_CAPTURE_BYTES=8000 \
          MIN_BOARD_SSIM=0.93 \
          PARITY_CASE_IDS=prod_geometry_circumcircle \
          npm --prefix tools/visual-parity run audit
          CORPUS_SOURCE=production \
          INPUT_DIR=captures/stable/midpoint-interaction \
          MIN_CAPTURE_BYTES=8000 \
          MIN_BOARD_SSIM=0.93 \
          PARITY_CASE_IDS=prod_geometry_midpoints \
          npm --prefix tools/visual-parity run audit
          CORPUS_SOURCE=production \
          INPUT_DIR=captures/stable/orthogonal-interaction \
          MIN_CAPTURE_BYTES=8000 \
          MIN_BOARD_SSIM=0.93 \
          PARITY_CASE_IDS=prod_geometry_orthogonal_constructions \
          npm --prefix tools/visual-parity run audit
          CORPUS_SOURCE=production \
          INPUT_DIR=captures/stable/dynamic-circle-interaction \
          MIN_CAPTURE_BYTES=8000 \
          MIN_BOARD_SSIM=0.93 \
          PARITY_CASE_IDS=prod_interaction_dynamic_circle_radius \
          npm --prefix tools/visual-parity run audit
          CORPUS_SOURCE=production \
          INPUT_DIR=captures/stable/dynamic-segment-interaction \
          MIN_CAPTURE_BYTES=8000 \
          MIN_BOARD_SSIM=0.93 \
          PARITY_CASE_IDS=prod_geometry_fixed_length_segment \
          npm --prefix tools/visual-parity run audit
          INPUT_DIR=captures/stable/curve-boolean-interaction \
          MIN_CAPTURE_BYTES=8000 \
          MIN_BOARD_SSIM=0.90 \
          PARITY_CASE_IDS=curve_boolean_clipping \
          npm --prefix tools/visual-parity run audit
          INPUT_DIR=captures/stable/inequality-line-interaction \
          MIN_CAPTURE_BYTES=5000 \
          MIN_BOARD_SSIM=0.90 \
          PARITY_CASE_IDS=inequalities \
          npm --prefix tools/visual-parity run audit
          INPUT_DIR=captures/stable/inequality-function-interaction \
          MIN_CAPTURE_BYTES=5000 \
          MIN_BOARD_SSIM=0.90 \
          PARITY_CASE_IDS=inequalities \
          npm --prefix tools/visual-parity run audit
          INPUT_DIR=captures/stable/vector-field-interaction \
          MIN_CAPTURE_BYTES=5000 \
          MIN_BOARD_SSIM=0.90 \
          PARITY_CASE_IDS=vector_fields \
          npm --prefix tools/visual-parity run audit
          INPUT_DIR=captures/stable/slope-field-interaction \
          MIN_CAPTURE_BYTES=5000 \
          MIN_BOARD_SSIM=0.90 \
          PARITY_CASE_IDS=slope_fields \
          npm --prefix tools/visual-parity run audit
          INPUT_DIR=captures/stable/ellipse-interaction \
          MIN_CAPTURE_BYTES=5000 \
          MIN_BOARD_SSIM=0.90 \
          PARITY_CASE_IDS=ellipses \
          npm --prefix tools/visual-parity run audit
          INPUT_DIR=captures/stable/hyperbola-interaction \
          MIN_CAPTURE_BYTES=5000 \
          MIN_BOARD_SSIM=0.90 \
          PARITY_CASE_IDS=hyperbolas \
          npm --prefix tools/visual-parity run audit

      - name: Generate production contact pages
        run: |
          CORPUS_SOURCE=production \
          INPUT_DIR=captures/stable/production-desktop \
          OUTPUT_DIR=captures/stable/production-desktop/evidence \
          npm --prefix tools/visual-parity run contact-pages

      - name: Upload Stable visual evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stable-visual-evidence
          path: captures/stable
          retention-days: 14
