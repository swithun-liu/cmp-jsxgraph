<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3f5f7">
    <link rel="icon" href="data:,">
    <title>CMP JSXGraph</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #f3f5f7;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .loading-shell {
            display: grid;
            width: 100%;
            height: 100%;
            place-items: center;
            color: #26323b;
        }

        .loading-panel {
            box-sizing: border-box;
            width: min(520px, calc(100vw - 32px));
            padding: 24px;
            border: 1px solid #d6dce2;
            border-radius: 8px;
            background: #fcfdfe;
        }

        .loading-heading {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 20px;
        }

        .loading-title {
            margin: 0;
            font-size: 22px;
            font-weight: 650;
            letter-spacing: 0;
        }

        .loading-percent {
            color: #246bce;
            font-size: 14px;
            font-variant-numeric: tabular-nums;
            font-weight: 650;
        }

        .loading-status {
            margin: 10px 0 16px;
            color: #66717b;
            font-size: 14px;
            letter-spacing: 0;
        }

        .loading-track {
            height: 4px;
            overflow: hidden;
            background: #dce2e8;
        }

        .loading-progress {
            width: 18%;
            height: 100%;
            background: #246bce;
            animation: loading-slide 1.2s ease-in-out infinite alternate;
        }

        .loading-progress.determinate {
            animation: none;
            transition: width 160ms ease-out;
        }

        .loading-note {
            margin: 16px 0 0;
            color: #7b858e;
            font-size: 12px;
            line-height: 1.5;
            letter-spacing: 0;
        }

        .loading-error .loading-percent,
        .loading-error .loading-status {
            color: #b3261e;
        }

        .loading-error .loading-progress {
            width: 100%;
            animation: none;
            background: #b3261e;
        }

        @keyframes loading-slide {
            from { transform: translateX(0); }
            to { transform: translateX(455%); }
        }
    </style>
    <script>
        (() => {
            const useChunkLoader =
                window.location.hostname.endsWith(".github.io") ||
                new URLSearchParams(window.location.search)
                    .get("chunkedWasm") === "true";
            if (!useChunkLoader) {
                return;
            }

            const nativeFetch = window.fetch.bind(window);
            let loadedBytes = 0;
            let totalBytes = 0;
            let chunkRequestQueue = Promise.resolve();

            const setStatus = (message) => {
                const element = document.querySelector("#loading-status");
                if (element !== null) {
                    element.textContent = message;
                }
            };

            const setProgress = () => {
                if (totalBytes === 0) {
                    return;
                }
                const percent = Math.round(loadedBytes * 100 / totalBytes);
                const bar = document.querySelector("#loading-progress");
                const label = document.querySelector("#loading-percent");
                if (bar !== null) {
                    bar.classList.add("determinate");
                    bar.style.transform = "none";
                    bar.style.width = `${percent}%`;
                }
                if (label !== null) {
                    label.textContent = `${percent}%`;
                }
            };

            const queueChunkRequest = (request) => {
                const result = chunkRequestQueue.then(request);
                chunkRequestQueue = result.then(
                    () => undefined,
                    () => undefined,
                );
                return result;
            };

            const fetchChunkedWasm = async (requestUrl) => {
                const manifestUrl = new URL(requestUrl);
                manifestUrl.pathname = `${manifestUrl.pathname}.chunks.json`;
                const manifestResponse = await nativeFetch(manifestUrl);
                if (!manifestResponse.ok) {
                    throw new Error(`Failed to load ${manifestUrl}`);
                }
                const manifest = await manifestResponse.json();
                const useCompression =
                    typeof DecompressionStream === "function" &&
                    typeof TransformStream === "function" &&
                    manifest.compression?.format === "gzip-base64";
                const payload = useCompression
                    ? manifest.compression
                    : manifest;
                totalBytes += payload.byteLength;
                setProgress();

                const chunkResults = payload.chunks.map(
                    (chunkName) =>
                        queueChunkRequest(async () => {
                            const chunkResponse = await nativeFetch(
                                new URL(chunkName, manifestUrl),
                            );
                            if (!chunkResponse.ok) {
                                throw new Error(
                                    `Failed to load ${chunkName}`,
                                );
                            }
                            const chunk = useCompression
                                ? decodeBase64(await chunkResponse.json())
                                : new Uint8Array(
                                    await chunkResponse.arrayBuffer(),
                                );
                            loadedBytes += chunk.byteLength;
                            setProgress();
                            return chunk;
                        }).then(
                            (chunk) => ({ chunk }),
                            (error) => ({ error }),
                        ),
                );
                let chunkIndex = 0;
                let streamedBytes = 0;
                const body = new ReadableStream({
                    async pull(controller) {
                        if (chunkIndex === chunkResults.length) {
                            if (streamedBytes !== payload.byteLength) {
                                controller.error(
                                    new Error(
                                        `Chunked Wasm length ` +
                                            `${streamedBytes} does not match ` +
                                            `${payload.byteLength}`,
                                    ),
                                );
                                return;
                            }
                            controller.close();
                            return;
                        }

                        const result = await chunkResults[chunkIndex];
                        chunkIndex += 1;
                        if (result.error !== undefined) {
                            controller.error(result.error);
                            return;
                        }
                        controller.enqueue(result.chunk);
                        streamedBytes += result.chunk.byteLength;
                    },
                });
                if (useCompression) {
                    let decompressedBytes = 0;
                    const decompressedBody = body
                        .pipeThrough(new DecompressionStream("gzip"))
                        .pipeThrough(new TransformStream({
                            transform(chunk, controller) {
                                decompressedBytes += chunk.byteLength;
                                controller.enqueue(chunk);
                            },
                            flush() {
                                if (
                                    decompressedBytes !==
                                    manifest.byteLength
                                ) {
                                    throw new Error(
                                        `Decompressed Wasm length ` +
                                            `${decompressedBytes} does not ` +
                                            `match ${manifest.byteLength}`,
                                    );
                                }
                            },
                        }));
                    return new Response(
                        decompressedBody,
                        {
                            headers: {
                                "Content-Type": "application/wasm",
                            },
                        },
                    );
                }
                return new Response(
                    body,
                    { headers: { "Content-Type": "application/wasm" } },
                );
            };

            const decodeBase64 = (base64) => {
                const binary = window.atob(base64);
                const bytes = new Uint8Array(binary.length);
                for (let index = 0; index < binary.length; index += 1) {
                    bytes[index] = binary.charCodeAt(index);
                }
                return bytes;
            };

            window.fetch = async (input, options) => {
                const requestUrl = new URL(
                    input instanceof Request ? input.url : input,
                    window.location.href,
                );
                if (!requestUrl.pathname.endsWith(".wasm")) {
                    return nativeFetch(input, options);
                }

                setStatus("Downloading and compiling renderer");
                return fetchChunkedWasm(requestUrl);
            };

            const showLoadingFailure = () => {
                document.querySelector("#loading-shell")
                    ?.classList.add("loading-error");
                setStatus("Loading failed. Refresh to retry.");
            };
            window.addEventListener("error", showLoadingFailure);
            window.addEventListener("unhandledrejection", showLoadingFailure);
        })();
    </script>
    <script defer type="application/javascript" src="cmp-jsxgraph.js"></script>
</head>
<body>
    <main class="loading-shell" id="loading-shell" aria-busy="true">
        <section class="loading-panel">
            <div class="loading-heading">
                <h1 class="loading-title">CMP JSXGraph</h1>
                <span class="loading-percent" id="loading-percent">Starting</span>
            </div>
            <p class="loading-status" id="loading-status">Preparing progress workspace</p>
            <div class="loading-track">
                <div
                    class="loading-progress"
                    id="loading-progress"
                    role="progressbar"
                    aria-label="Loading CMP JSXGraph"
                ></div>
            </div>
            <p class="loading-note">
                Pure Kotlin geometry and Compose Canvas, with an isolated
                JSXGraph 1.13.3 reference renderer for visual comparison.
            </p>
        </section>
    </main>
</body>
</html>
