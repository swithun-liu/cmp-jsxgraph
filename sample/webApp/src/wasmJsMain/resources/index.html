<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f3f5f7">
    <link rel="icon" href="data:,">
    <title>CMP JSXGraph</title>
    <style>
        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            overflow: hidden;
            background: #f3f5f7;
        }

        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        }

        .loading-shell {
            display: grid;
            width: 100%;
            height: 100%;
            place-items: center;
            color: #26323b;
        }

        .loading-panel {
            box-sizing: border-box;
            width: min(520px, calc(100vw - 32px));
            padding: 24px;
            border: 1px solid #d6dce2;
            border-radius: 8px;
            background: #fcfdfe;
        }

        .loading-heading {
            display: flex;
            align-items: baseline;
            justify-content: space-between;
            gap: 20px;
        }

        .loading-title {
            margin: 0;
            font-size: 22px;
            font-weight: 650;
            letter-spacing: 0;
        }

        .loading-percent {
            color: #246bce;
            font-size: 14px;
            font-variant-numeric: tabular-nums;
            font-weight: 650;
        }

        .loading-status {
            margin: 10px 0 16px;
            color: #66717b;
            font-size: 14px;
            letter-spacing: 0;
        }

        .loading-track {
            height: 4px;
            overflow: hidden;
            background: #dce2e8;
        }

        .loading-progress {
            width: 18%;
            height: 100%;
            background: #246bce;
            animation: loading-slide 1.2s ease-in-out infinite alternate;
        }

        .loading-progress.determinate {
            animation: none;
            transition: width 160ms ease-out;
        }

        .loading-note {
            margin: 16px 0 0;
            color: #7b858e;
            font-size: 12px;
            line-height: 1.5;
            letter-spacing: 0;
        }

        .loading-error .loading-percent,
        .loading-error .loading-status {
            color: #b3261e;
        }

        .loading-error .loading-progress {
            width: 100%;
            animation: none;
            background: #b3261e;
        }

        @keyframes loading-slide {
            from { transform: translateX(0); }
            to { transform: translateX(455%); }
        }
    </style>
    <!-- CMP_JSXGRAPH_EMBEDDED_WASM -->
    <script>
        (() => {
            const searchParams = new URLSearchParams(
                window.location.search,
            );
            const useChunkLoader =
                window.location.hostname.endsWith(".github.io") ||
                searchParams.get("chunkedWasm") === "true";
            if (!useChunkLoader) {
                return;
            }

            const embeddedWasmElement = document.querySelector(
                "#cmp-jsxgraph-embedded-wasm",
            );
            const embeddedWasmPayload = embeddedWasmElement === null
                ? null
                : JSON.parse(embeddedWasmElement.textContent);
            const embeddedWasmAssets =
                searchParams.get("embeddedWasm") === "false" ||
                typeof embeddedWasmPayload?.assets !== "object"
                    ? {}
                    : embeddedWasmPayload.assets;
            const nativeFetch = window.fetch.bind(window);
            const chunkRequestAttempts = 3;
            const chunkRequestTimeoutMillis = 15_000;
            const scriptChunkPayloads = new Map();
            const activeScriptChunkNames = new Set();
            let loadedBytes = 0;
            let totalBytes = 0;
            let chunkRequestQueue = Promise.resolve();

            globalThis.__cmpJsxGraphRegisterWasmChunk = (
                chunkName,
                base64,
            ) => {
                if (
                    activeScriptChunkNames.has(chunkName) &&
                    typeof base64 === "string"
                ) {
                    scriptChunkPayloads.set(chunkName, base64);
                }
            };

            const setStatus = (message) => {
                const element = document.querySelector("#loading-status");
                if (element !== null) {
                    element.textContent = message;
                }
            };

            const setProgress = () => {
                if (totalBytes === 0) {
                    return;
                }
                const percent = Math.round(loadedBytes * 100 / totalBytes);
                const bar = document.querySelector("#loading-progress");
                const label = document.querySelector("#loading-percent");
                if (bar !== null) {
                    bar.classList.add("determinate");
                    bar.style.transform = "none";
                    bar.style.width = `${percent}%`;
                }
                if (label !== null) {
                    label.textContent = `${percent}%`;
                }
            };

            const queueChunkRequest = (request) => {
                const result = chunkRequestQueue.then(request);
                chunkRequestQueue = result.then(
                    () => undefined,
                    () => undefined,
                );
                return result;
            };

            const retryChunkRequest = async (chunkUrl, request) => {
                let lastError;
                for (
                    let attempt = 0;
                    attempt < chunkRequestAttempts;
                    attempt += 1
                ) {
                    const attemptUrl = new URL(chunkUrl);
                    if (attempt > 0) {
                        attemptUrl.searchParams.set(
                            "retry",
                            attempt.toString(),
                        );
                    }
                    try {
                        const chunk = await request(attemptUrl, attempt);
                        if (attempt > 0) {
                            setStatus(
                                "Downloading and compiling renderer",
                            );
                        }
                        return chunk;
                    } catch (error) {
                        lastError = error;
                        if (attempt + 1 < chunkRequestAttempts) {
                            setStatus(
                                `Retrying renderer download ` +
                                    `(${attempt + 2}/` +
                                    `${chunkRequestAttempts})`,
                            );
                        }
                    }
                }
                const reason = lastError instanceof Error
                    ? lastError.message
                    : String(lastError);
                throw new Error(
                    `Failed to load ${chunkUrl} after ` +
                        `${chunkRequestAttempts} attempts: ${reason}`,
                );
            };

            const fetchChunkWithRetry = (
                chunkUrl,
                decodeJsonBase64,
            ) => retryChunkRequest(
                chunkUrl,
                async (attemptUrl, attempt) => {
                    const controller = new AbortController();
                    const timeoutId = window.setTimeout(
                        () => controller.abort(),
                        chunkRequestTimeoutMillis,
                    );
                    try {
                        const response = await nativeFetch(
                            attemptUrl,
                            {
                                cache: attempt === 0
                                    ? "default"
                                    : "no-store",
                                signal: controller.signal,
                            },
                        );
                        if (!response.ok) {
                            throw new Error(
                                `HTTP ${response.status} for ${chunkUrl}`,
                            );
                        }
                        return decodeJsonBase64
                            ? decodeBase64(await response.json())
                            : new Uint8Array(
                                await response.arrayBuffer(),
                            );
                    } finally {
                        window.clearTimeout(timeoutId);
                    }
                },
            );

            const loadScriptChunkWithRetry = (
                chunkUrl,
                chunkName,
            ) => retryChunkRequest(
                chunkUrl,
                (attemptUrl) => new Promise((resolve, reject) => {
                    const script = document.createElement("script");
                    let settled = false;
                    const finish = (error) => {
                        if (settled) {
                            return;
                        }
                        settled = true;
                        window.clearTimeout(timeoutId);
                        script.remove();
                        activeScriptChunkNames.delete(chunkName);
                        const base64 = scriptChunkPayloads.get(chunkName);
                        scriptChunkPayloads.delete(chunkName);
                        if (error !== null) {
                            reject(error);
                        } else if (typeof base64 !== "string") {
                            reject(new Error(
                                `Script did not register ${chunkName}`,
                            ));
                        } else {
                            resolve(decodeBase64(base64));
                        }
                    };
                    const timeoutId = window.setTimeout(
                        () => finish(new Error(
                            `Timed out loading ${chunkUrl}`,
                        )),
                        chunkRequestTimeoutMillis,
                    );
                    script.async = true;
                    script.src = attemptUrl.href;
                    script.onload = () => window.setTimeout(
                        () => finish(null),
                        0,
                    );
                    script.onerror = () => window.setTimeout(
                        () => finish(new Error(
                            `Failed to load script ${chunkUrl}`,
                        )),
                        0,
                    );
                    scriptChunkPayloads.delete(chunkName);
                    activeScriptChunkNames.add(chunkName);
                    document.head.append(script);
                }),
            );

            const fetchChunkedWasm = async (requestUrl) => {
                const manifestUrl = new URL(requestUrl);
                manifestUrl.pathname = `${manifestUrl.pathname}.chunks.json`;
                const assetName = decodeURIComponent(
                    requestUrl.pathname.split("/").at(-1),
                );
                let manifest = embeddedWasmAssets[assetName];
                if (manifest === undefined) {
                    const manifestResponse = await nativeFetch(manifestUrl);
                    if (!manifestResponse.ok) {
                        throw new Error(`Failed to load ${manifestUrl}`);
                    }
                    manifest = await manifestResponse.json();
                }
                const compressionFormat = manifest.compression?.format;
                const useCompression =
                    typeof DecompressionStream === "function" &&
                    typeof TransformStream === "function" &&
                    (
                        compressionFormat === "gzip" ||
                        compressionFormat === "gzip-base64" ||
                        compressionFormat === "gzip-base64-script" ||
                        compressionFormat === "gzip-base64-embedded"
                    );
                const payload = useCompression
                    ? manifest.compression
                    : manifest;
                const useEmbeddedCompression =
                    useCompression &&
                    compressionFormat === "gzip-base64-embedded";
                const useScriptCompression =
                    useCompression &&
                    compressionFormat === "gzip-base64-script";
                totalBytes += payload.byteLength;
                setProgress();

                const chunkResults = payload.chunks.map(
                    (chunkEntry) =>
                        queueChunkRequest(async () => {
                            const chunk =
                                useEmbeddedCompression
                                    ? decodeBase64(chunkEntry)
                                    : useScriptCompression
                                        ? await loadScriptChunkWithRetry(
                                            new URL(
                                                chunkEntry,
                                                manifestUrl,
                                            ),
                                            chunkEntry,
                                        )
                                        : await fetchChunkWithRetry(
                                            new URL(
                                                chunkEntry,
                                                manifestUrl,
                                            ),
                                            useCompression &&
                                                compressionFormat ===
                                                    "gzip-base64",
                                        );
                            loadedBytes += chunk.byteLength;
                            setProgress();
                            return chunk;
                        }).then(
                            (chunk) => ({ chunk }),
                            (error) => ({ error }),
                        ),
                );
                let chunkIndex = 0;
                let streamedBytes = 0;
                const body = new ReadableStream({
                    async pull(controller) {
                        if (chunkIndex === chunkResults.length) {
                            if (streamedBytes !== payload.byteLength) {
                                controller.error(
                                    new Error(
                                        `Chunked Wasm length ` +
                                            `${streamedBytes} does not match ` +
                                            `${payload.byteLength}`,
                                    ),
                                );
                                return;
                            }
                            controller.close();
                            return;
                        }

                        const result = await chunkResults[chunkIndex];
                        chunkIndex += 1;
                        if (result.error !== undefined) {
                            controller.error(result.error);
                            return;
                        }
                        controller.enqueue(result.chunk);
                        streamedBytes += result.chunk.byteLength;
                    },
                });
                if (useCompression) {
                    let decompressedBytes = 0;
                    const decompressedBody = body
                        .pipeThrough(new DecompressionStream("gzip"))
                        .pipeThrough(new TransformStream({
                            transform(chunk, controller) {
                                decompressedBytes += chunk.byteLength;
                                controller.enqueue(chunk);
                            },
                            flush() {
                                if (
                                    decompressedBytes !==
                                    manifest.byteLength
                                ) {
                                    throw new Error(
                                        `Decompressed Wasm length ` +
                                            `${decompressedBytes} does not ` +
                                            `match ${manifest.byteLength}`,
                                    );
                                }
                            },
                        }));
                    return new Response(
                        decompressedBody,
                        {
                            headers: {
                                "Content-Type": "application/wasm",
                            },
                        },
                    );
                }
                return new Response(
                    body,
                    { headers: { "Content-Type": "application/wasm" } },
                );
            };

            const decodeBase64 = (base64) => {
                const binary = window.atob(base64);
                const bytes = new Uint8Array(binary.length);
                for (let index = 0; index < binary.length; index += 1) {
                    bytes[index] = binary.charCodeAt(index);
                }
                return bytes;
            };

            window.fetch = async (input, options) => {
                const requestUrl = new URL(
                    input instanceof Request ? input.url : input,
                    window.location.href,
                );
                if (!requestUrl.pathname.endsWith(".wasm")) {
                    return nativeFetch(input, options);
                }

                setStatus("Downloading and compiling renderer");
                return fetchChunkedWasm(requestUrl);
            };

            const showLoadingFailure = () => {
                document.querySelector("#loading-shell")
                    ?.classList.add("loading-error");
                setStatus("Loading failed. Refresh to retry.");
            };
            window.addEventListener("error", showLoadingFailure);
            window.addEventListener("unhandledrejection", showLoadingFailure);
        })();
    </script>
    <script defer type="application/javascript" src="cmp-jsxgraph.js"></script>
</head>
<body>
    <main class="loading-shell" id="loading-shell" aria-busy="true">
        <section class="loading-panel">
            <div class="loading-heading">
                <h1 class="loading-title">CMP JSXGraph</h1>
                <span class="loading-percent" id="loading-percent">Starting</span>
            </div>
            <p class="loading-status" id="loading-status">Preparing progress workspace</p>
            <div class="loading-track">
                <div
                    class="loading-progress"
                    id="loading-progress"
                    role="progressbar"
                    aria-label="Loading CMP JSXGraph"
                ></div>
            </div>
            <p class="loading-note">
                Pure Kotlin geometry and Compose Canvas, with an isolated
                JSXGraph 1.13.3 reference renderer for visual comparison.
            </p>
        </section>
    </main>
</body>
</html>
