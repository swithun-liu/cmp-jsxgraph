name: CMPJsxGraph
options:
  bundleIdPrefix: com.swithun.jsxgraph
  xcodeVersion: "15.4"
  projectFormat: xcode15_3
  deploymentTarget:
    iOS: "17.2"
settings:
  base:
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    FRAMEWORK_SEARCH_PATHS:
      - "$(inherited)"
      - "$(SRCROOT)/../../jsxgraph-debug-ui/build/xcode-frameworks/$(CONFIGURATION)/$(SDK_NAME)"
    OTHER_LDFLAGS:
      - "$(inherited)"
      - "-framework"
      - "CmpJsxGraphDebugUi"
targets:
  CMPJsxGraph:
    type: application
    platform: iOS
    sources:
      - path: iosApp
    info:
      path: iosApp/Info.plist
      properties:
        CFBundleDisplayName: CMP JSXGraph
        CADisableMinimumFrameDurationOnPhone: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.swithun.jsxgraph.sample
        PRODUCT_NAME: CMP JSXGraph
        TARGETED_DEVICE_FAMILY: "1,2"
    preBuildScripts:
      - name: Build CMP JSXGraph KMP framework
        basedOnDependencyAnalysis: false
        script: |
          cd "$SRCROOT/../.."
          export JAVA_HOME=$(/usr/libexec/java_home -v 17)
          ./gradlew :jsxgraph-debug-ui:embedAndSignAppleFrameworkForXcode
schemes:
  CMPJsxGraph:
    build:
      targets:
        CMPJsxGraph: all
    run:
      config: Debug
