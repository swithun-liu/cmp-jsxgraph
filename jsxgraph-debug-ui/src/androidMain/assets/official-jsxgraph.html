<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'none'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src data:; connect-src 'none'; object-src 'none'; frame-src 'none'"
  >
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Official JSXGraph</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="jsxgraph-1.13.3.css">
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fcfdfe;
    }

    #jxgbox {
      position: fixed;
      inset: 0;
      border: 0;
      background: #fcfdfe;
    }

    #error {
      display: none;
      box-sizing: border-box;
      width: 100%;
      height: 100%;
      padding: 24px;
      align-items: center;
      justify-content: center;
      color: #b91c1c;
      font: 13px/1.45 Arial, sans-serif;
      text-align: center;
      white-space: pre-wrap;
    }
  </style>
  <script defer src="jsxgraphcore-1.13.3.js"></script>
</head>
<body>
  <div id="jxgbox" class="jxgbox" aria-label="Official JSXGraph rendering"></div>
  <div id="error" role="alert"></div>
  <script>
    (() => {
      const boardElement = document.querySelector("#jxgbox");
      const errorElement = document.querySelector("#error");
      let board = null;
      let requestId = 0;
      let resizeFrame = 0;

      const notifyParent = (message) => {
        if (window.parent !== window) {
          window.parent.postMessage(message, window.location.origin);
        }
      };

      const notifyReady = (width, height) => {
        window.CmpJsxGraphBridge?.onRenderReady(width, height);
        notifyParent(`cmp-jsxgraph:ready:${width}:${height}`);
      };

      const notifyError = (message) => {
        window.CmpJsxGraphBridge?.onRenderError(message);
        notifyParent(`cmp-jsxgraph:error:${message}`);
      };

      const waitForLayout = async () => {
        await new Promise(requestAnimationFrame);
        await new Promise(requestAnimationFrame);
      };

      const waitForContainerSize = async () => {
        for (let attempt = 0; attempt < 120; attempt += 1) {
          const bounds = boardElement.getBoundingClientRect();
          if (bounds.width > 0 && bounds.height > 0) {
            return;
          }
          await new Promise(requestAnimationFrame);
        }
        throw new Error("Official JSXGraph container has no visible size");
      };

      const resizeBoard = () => {
        resizeFrame = 0;
        if (board === null) {
          return;
        }
        const bounds = boardElement.getBoundingClientRect();
        if (
          bounds.width <= 0 ||
          bounds.height <= 0 ||
          (
            board.canvasWidth === bounds.width &&
            board.canvasHeight === bounds.height
          )
        ) {
          return;
        }
        // JSXGraph: src/base/board.js -> resizeContainer.
        board.resizeContainer(bounds.width, bounds.height, true);
        board.fullUpdate();
        notifyReady(String(bounds.width), String(bounds.height));
      };

      if (typeof ResizeObserver === "function") {
        new ResizeObserver(() => {
          if (resizeFrame !== 0) {
            cancelAnimationFrame(resizeFrame);
          }
          resizeFrame = requestAnimationFrame(resizeBoard);
        }).observe(boardElement);
      }

      const showError = (message) => {
        boardElement.style.display = "none";
        errorElement.style.display = "flex";
        errorElement.textContent = message;
        notifyError(message);
      };

      const isObject = (value) =>
        value !== null &&
        typeof value === "object" &&
        !Array.isArray(value);

      const rejectUnknownFields = (value, allowed, label) => {
        const unknown = Object.keys(value).find((field) => !allowed.has(field));
        if (unknown !== undefined) {
          throw new Error(`Unsupported ${label} field: ${unknown}`);
        }
      };

      const parseJessieCodeInput = (documentSource) => {
        rejectUnknownFields(
          documentSource,
          new Set(["schemaVersion", "inputKind", "boardOptions", "source"]),
          "JessieCode parity",
        );
        if (documentSource.schemaVersion !== 1) {
          throw new Error(
            `Unsupported JessieCode parity schemaVersion: ${documentSource.schemaVersion}`,
          );
        }
        if (documentSource.inputKind !== "jessiecode") {
          throw new Error(
            `Unsupported parity inputKind: ${documentSource.inputKind}`,
          );
        }
        if (!isObject(documentSource.boardOptions)) {
          throw new Error("JessieCode parity boardOptions must be an object");
        }
        const boardOptions = documentSource.boardOptions;
        rejectUnknownFields(
          boardOptions,
          new Set([
            "containerId",
            "boundingBox",
            "axis",
            "grid",
            "keepAspectRatio",
          ]),
          "JessieCode boardOptions",
        );
        if (boardOptions.containerId !== "jxgbox") {
          throw new Error(
            "JessieCode parity boardOptions.containerId must be jxgbox",
          );
        }
        if (
          !Array.isArray(boardOptions.boundingBox) ||
          boardOptions.boundingBox.length !== 4 ||
          !boardOptions.boundingBox.every(
            (value) => typeof value === "number" && Number.isFinite(value),
          ) ||
          boardOptions.boundingBox[0] >= boardOptions.boundingBox[2] ||
          boardOptions.boundingBox[3] >= boardOptions.boundingBox[1]
        ) {
          throw new Error(
            "JessieCode parity boardOptions.boundingBox must contain " +
              "four finite numbers with positive size",
          );
        }
        ["axis", "grid", "keepAspectRatio"].forEach((field) => {
          if (typeof boardOptions[field] !== "boolean") {
            throw new Error(
              `JessieCode parity boardOptions.${field} must be a boolean`,
            );
          }
        });
        if (typeof documentSource.source !== "string") {
          throw new Error("JessieCode parity source must be a string");
        }
        return {
          inputKind: "jessiecode",
          boardOptions,
          source: documentSource.source,
        };
      };

      const parseRenderInput = (source) => {
        const documentSource = JSON.parse(source);
        if (!isObject(documentSource)) {
          throw new Error("Parity source must be a JSON object");
        }
        if (documentSource.inputKind !== undefined) {
          return parseJessieCodeInput(documentSource);
        }
        return {
          inputKind: "construction-document",
          boardOptions: {
            boundingBox: documentSource.boundingBox,
            axis: documentSource.axis ?? false,
            grid: documentSource.grid ?? false,
            keepAspectRatio: documentSource.keepAspectRatio ?? false,
          },
          documentSource,
        };
      };

      window.renderDiagram = async (source) => {
        const currentRequest = ++requestId;
        try {
          const renderInput = parseRenderInput(source);
          await waitForContainerSize();
          if (currentRequest !== requestId) {
            return;
          }
          if (board !== null) {
            JXG.JSXGraph.freeBoard(board);
            board = null;
          }
          errorElement.style.display = "none";
          boardElement.style.display = "block";
          boardElement.replaceChildren();

          board = JXG.JSXGraph.initBoard("jxgbox", {
            boundingbox: renderInput.boardOptions.boundingBox,
            axis: renderInput.boardOptions.axis,
            grid: renderInput.boardOptions.grid,
            keepaspectratio: renderInput.boardOptions.keepAspectRatio,
            showCopyright: false,
            showNavigation: false,
            pan: { enabled: false },
            zoom: { enabled: false },
          });

          if (renderInput.inputKind === "jessiecode") {
            // JSXGraph: src/parser/jessiecode.js -> parse.
            board.jc.parse(renderInput.source);
          } else {
            const documentSource = renderInput.documentSource;
            if (!Array.isArray(documentSource.objects)) {
              throw new Error("objects must be an array");
            }
            const ids = new Set();
            const transformationsById = new Map();
            documentSource.objects.forEach((sourceObject, index) => {
              if (!isObject(sourceObject)) {
                throw new Error(`objects[${index}] must be an object`);
              }
              if (
                typeof sourceObject.id !== "string" ||
                sourceObject.id.length === 0
              ) {
                throw new Error(
                  `objects[${index}].id must be a non-empty string`,
                );
              }
              if (ids.has(sourceObject.id)) {
                throw new Error(`Duplicate object id: ${sourceObject.id}`);
              }
              if (
                typeof sourceObject.type !== "string" ||
                sourceObject.type.length === 0
              ) {
                throw new Error(
                  `objects[${index}].type must be a non-empty string`,
                );
              }
              if (!Array.isArray(sourceObject.parents)) {
                throw new Error(`objects[${index}].parents must be an array`);
              }
              const attributes = {
                ...(sourceObject.attributes ?? {}),
              };
              if (
                attributes.id !== undefined &&
                attributes.id !== sourceObject.id
              ) {
                throw new Error(
                  `objects[${index}].attributes.id must match object id`,
                );
              }
              attributes.id = sourceObject.id;
              const parents = sourceObject.parents.slice();
              const elementType = sourceObject.type.toLowerCase();
              const transformationIndex =
                elementType === "point"
                  ? 1
                  : elementType === "point3d"
                    ? 2
                    : -1;
              if (
                transformationIndex >= 0 &&
                transformationIndex < parents.length
              ) {
                const transformationParent = parents[transformationIndex];
                if (typeof transformationParent === "string") {
                  parents[transformationIndex] =
                    transformationsById.get(transformationParent) ??
                    transformationParent;
                } else if (
                  Array.isArray(transformationParent) &&
                  transformationParent.length > 0
                ) {
                  const transformations = transformationParent.map(
                    (id) => transformationsById.get(id),
                  );
                  if (
                    transformations.every(
                      (transformation) => transformation !== undefined,
                    )
                  ) {
                    parents[transformationIndex] = transformations;
                  }
                }
              }
              const element = board.create(
                sourceObject.type,
                parents,
                attributes,
              );
              if (element === undefined || element === null) {
                throw new Error(
                  `Could not create objects[${index}] '${sourceObject.id}'`,
                );
              }
              if (
                elementType === "transform" ||
                elementType === "transform3d"
              ) {
                // Mirrors the construction-document adapter while retaining
                // JSXGraph's own createPoint/createPoint3D dispatch.
                transformationsById.set(sourceObject.id, element);
              }
              ids.add(sourceObject.id);
            });
          }

          board.fullUpdate();
          await waitForLayout();
          if (currentRequest !== requestId) {
            return;
          }
          notifyReady(
            String(boardElement.clientWidth),
            String(boardElement.clientHeight),
          );
        } catch (failure) {
          if (currentRequest !== requestId) {
            return;
          }
          showError(failure?.message ?? String(failure));
        }
      };
    })();
  </script>
</body>
</html>
